<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy - Beautify your posts background</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1a1e;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden !important;
            margin: 0;
        }

        /* Main Preview Canvas Area */
        .preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121215;
            position: relative;
            overflow: hidden;
            padding: 40px;
        }

        .canvas-wrapper {
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 1000px;
            height: 600px;
            object-fit: contain;
        }

        /* Sidebar Control Panel */
        .sidebar {
            width: 420px;
            background: #18181c;
            border-left: 1px, #2a2a30;
            border-left: 1px solid #2a2a30;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            padding: 24px;
        }

        /* Ensure the sidebar/control container fits cleanly without horizontal overflow */
        .sidebar, .control-panel, .panel {
            max-width: 100%;
            box-sizing: border-box;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: none; /* chrome, edge */
        }
        .sidebar::-webkit-scrollbar, .control-panel::-webkit-scrollbar, .panel::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }
        .stroke-row, .control-row {
            flex-wrap: nowrap;
            gap: 6px;
            width: 100%;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 24px;
        }

        /* Section headings */
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            margin-top: 16px;
        }

        /* 3x3 Background Theme Grid */
        .bg-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .bg-thumb {
            aspect-ratio: 16/10;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            overflow: hidden;
            position: relative;
            transition: all 0.2s ease;
            background-size: cover;
            background-position: center;
        }

        .bg-thumb:hover {
            transform: scale(1.03);
            border-color: rgba(255,255,255,0.4);
        }

        .bg-thumb.active {
            border-color: #0a84ff;
            box-shadow: 0 0 12px rgba(10, 132, 255, 0.4);
        }

        /* Control Groups */
        .control-group {
            margin-bottom: 16px;
        }

        .control-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }

        .control-field {
            flex: 1;
            background: #222228;
            border: 1px solid #2f2f38;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: ew-resize;
            transition: border-color 0.2s;
        }

        .control-field:hover {
            border-color: #484854;
        }

        .control-field label {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 500;
            cursor: ew-resize;
        }

        .control-field input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            width: 50px;
            text-align: right;
            outline: none;
        }

        /* Full width inputs */
        .full-field {
            width: 100%;
            background: #222228;
            border: 1px solid #2f2f38;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: ew-resize;
            margin-bottom: 8px;
        }

        .full-field label {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 500;
        }

        .full-field input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            width: 60px;
            text-align: right;
            outline: none;
        }
        /* New */
        /* Color Picker & Text Input Styling */
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 1px solid #484854;
            border-radius: 4px;
        }

        .color-text {
            font-size: 12px;
            font-family: monospace;
            color: #ffffff;
            background: #18181c;
            border: 1px solid #2f2f38;
            border-radius: 4px;
            padding: 2px 6px;
            width: 70px;
            text-align: center;
            outline: none;
        }

        /* Stroke Color & Style Row */
        .stroke-row {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #222228;
            border: 1px solid #2f2f38;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 1px solid #484854;
            border-radius: 4px;
        }

        .color-text {
            font-size: 12px;
            font-family: monospace;
            color: #ffffff;
            background: #18181c;
            border: 1px solid #2f2f38;
            border-radius: 4px;
            padding: 2px 6px;
            width: 70px;
            text-align: center;
            outline: none;
        }

        /* Upload & Export Buttons */
        .upload-section {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid #2a2a30;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            background: #0a84ff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #0071e3;
        }

        .btn-export {
            background: #2c2c33;
            color: #ffffff;
            border: 1px solid #3a3a44;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-export:hover {
            background: #383842;
            border-color: #555562;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Canvas Preview Area -->
    <div class="preview-container">
        <div class="canvas-wrapper">
            <canvas id="canvas" width="1000" height="600"></canvas>
        </div>
    </div>

    <!-- Sidebar Controls -->
    <div class="sidebar">
        <div class="header">
            <h1>Fancy</h1>
            <p>Beautify your posts background with easy tool.</p>
        </div>

        <div class="section-title">Background Theme</div>
        <div class="bg-grid" id="bgGrid">
            <!-- Populated via JavaScript -->
        </div>

        <div class="section-title">Image Position</div>
        <div class="control-row">
            <div class="control-field" data-input="posX">
                <label>X</label>
                <input type="number" id="posX" value="150">
            </div>
            <div class="control-field" data-input="posY">
                <label>Y</label>
                <input type="number" id="posY" value="150">
            </div>
        </div>

        <div class="section-title">Image Transformation</div>
        <div class="control-row">
            <div class="control-field" data-input="scaleX" title="Scale (X %)">
                <label>Scale-X</label>
                <input type="number" id="scaleX" value="70">
            </div>
            <div class="control-field" data-input="scaleY" title="Scale (Y %)">
                <label>Scale-Y</label>
                <input type="number" id="scaleY" value="70">
            </div>
        </div>
        <div class="control-row">
            <div class="control-field" data-input="rotateX" title="3D Rotate X (Perspective)">
                <label>3D-X</label>
                <input type="number" id="rotateX" value="0">
            </div>
            <div class="control-field" data-input="rotateY" title="3D Rotate Y (Perspective)">
                <label>3D-Y</label>
                <input type="number" id="rotateY" value="0">
            </div>
            <div class="control-field" data-input="rotateZ" title="Z-Axis Rotation">
                <label>3D-Z</label>
                <input type="number" id="rotateZ" value="0">
            </div>
        </div>

        <div class="section-title">Drop Shadow</div>
        <div class="stroke-row">
            <div class="color-picker-wrapper">
                <input type="color" id="shadowColor" value="#000000">
                <input type="text" id="shadowColorText" class="color-text" value="#000000">
            </div>
            <div class="control-field" data-input="shadowOpacity" title="Shadow Opacity %" style="margin-bottom:0;">
                <label>Opacity</label>
                <input type="number" id="shadowOpacity" value="25" min="0" max="100">
            </div>
        </div>
        <div class="control-row">
            <div class="control-field" data-input="shadowX" title="Shadow X Offset">
                <label>X</label>
                <input type="number" id="shadowX" value="10">
            </div>
            <div class="control-field" data-input="shadowY" title="Shadow Y Offset">
                <label>Y</label>
                <input type="number" id="shadowY" value="20">
            </div>
        </div>
        <div class="control-row">
            <div class="control-field" data-input="shadowBlur" title="Shadow Blur (Figma properties)">
                <label>Blur</label>
                <input type="number" id="shadowBlur" value="30" min="0">
            </div>
            <div class="control-field" data-input="shadowSpread" title="Shadow Spread (Figma properties)">
                <label>Spread</label>
                <input type="number" id="shadowSpread" value="5">
            </div>
        </div>

        <!-- Reorganized Insert Text Section -->
        <div class="section-title">Insert Text</div>
        <div class="control-group" style="margin-bottom: 12px;">
            <input type="text" id="textContent" placeholder="Type your text here..." style="width:100%; background:#18181c; border:1px solid #2f2f38; border-radius:6px; padding:8px 10px; color:#fff; font-size:12px; outline:none; margin-bottom:8px; box-sizing:border-box;">
            
            <!-- Checkbox for Above Image -->
           <!-- <div style="margin-bottom: 8px; display: flex; align-items: center; gap: 6px; color:#18181C;">
                <input type="checkbox" id="textAbove" style="accent-color: #18181C; cursor: pointer;">
                <label for="textAbove" style="font-size: 12px; color: #a1a1aa; cursor: pointer;">Above image</label>
            </div> -->

            <!-- Text Color & Font Size Row -->
            <div style="display: flex; gap: 8px; margin-bottom: 8px; width: 100%;">
                <div class="color-picker-wrapper" style="flex: 1;">
                    <input type="color" id="textColor" value="#ffffff">
                    <input type="text" id="textColorText" class="color-text" value="#ffffff">
                </div>
                <div class="control-field" style="flex: 1; margin-bottom:0;">
                    <label>Size</label>
                    <input type="number" id="fontSize" value="46">
                </div>
            </div>

            <!-- Text X Offset & Y Gap Row -->
            <div class="control-row" style="display: flex; gap: 8px; width: 100%;">
                <div class="control-field" data-input="textX" style="flex: 1; margin-bottom:0;">
                    <label>X Offset</label>
                    <input type="number" id="textX" value="0">
                </div>
                <div class="control-field" data-input="textY" style="flex: 1; margin-bottom:0;">
                    <label>Y Offset</label>
                    <input type="number" id="textY" value="30">
                </div>
            </div>
        </div>

        <div class="section-title">Corner Radius</div>
        <div class="full-field" data-input="cornerRadius">
            <label>Radius</label>
            <input type="number" id="cornerRadius" value="10">
        </div>

        <div class="section-title">Stroke</div>
        <div class="stroke-row">
            <div class="color-picker-wrapper">
                <input type="color" id="strokeColor" value="#5b6ab3">
                <input type="text" id="strokeColorText" class="color-text" value="#5b6ab3" readonly>
            </div>
            <div class="control-field" data-input="strokeWidth" style="margin-bottom:0;">
                <label>Weight</label>
                <input type="number" id="strokeWidth" value="2">
            </div>
        </div>

        <!-- Upload & Export -->
        <div class="upload-section">
            <div class="bg-grid" id="imageThumbGrid" style="margin-bottom: 12px;">
            <!-- Populated dynamically when you upload multiple images -->
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple>
            <button class="btn-primary" onclick="document.getElementById('fileInput').click()">Upload Image</button>
            <button class="btn-export" id="exportBtn">Export PNG</button>
        </div>
    </div>

   <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // State variables
        let currentBgIndex = 0;
        let bgImages = [];
        let uploadedImages = [];
        let currentImageIndex = 0;

        // Default test image (gradient placeholder if no upload yet)
        const defaultImg = new Image();
        defaultImg.crossOrigin = "anonymous";
        defaultImg.src = " "
        defaultImg.onload = () => draw();

        // Background Theme Thumbnails Generation (Procedural Preview BGs matching reference)
        const bgFiles = [
            '1.jpg',
            '2.jpg',
            '3.jpg',
            '4.jpg',
            '5.jpg',
            '6.jpg',
            '7.jpg',
            '8.jpg',
            '9.jpg',
            '10.jpg',
            '11.jpg',
            '12.jpg',
            '13.jpg',
            '14.jpg',
            '15.jpg',
            '16.jpg',
            '17.jpg',
            '18.jpg',
            '19.jpg',
            '20.jpg',
            '21.jpg',
            '22.jpg',
            '23.jpg',
            '24.jpg',
        ];

        function createBgThumbnails() {
            const grid = document.getElementById('bgGrid');
            grid.innerHTML = '';
            
            bgFiles.forEach((file, index) => {
                const thumb = document.createElement('div');
                thumb.className = `bg-thumb ${index === 0 ? 'active' : ''}`;
                thumb.style.backgroundImage = `url('${file}')`;
                thumb.style.backgroundSize = 'cover';
                thumb.style.backgroundPosition = 'center';
                
                thumb.onclick = () => {
                    document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                    currentBgIndex = index;
                    draw();
                };
                grid.appendChild(thumb);

                const img = new Image();
                img.src = file;
                img.onload = () => {
                    bgImages[index] = img;
                    if (index === currentBgIndex) draw();
                };
            });
        }


        // Sync Shadow Color Inputs
        const shadowColorInput = document.getElementById('shadowColor');
        const shadowColorText = document.getElementById('shadowColorText');

        shadowColorInput.addEventListener('input', (e) => {
            shadowColorText.value = e.target.value;
            draw();
        });

        shadowColorText.addEventListener('input', (e) => {
            if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                shadowColorInput.value = e.target.value;
                draw();
            }
        });

        // 2. Sync Text Color inputs
        const textColorInput = document.getElementById('textColor');
        const textColorText = document.getElementById('textColorText');
        if (textColorInput && textColorText) {
            textColorInput.addEventListener('input', (e) => {
                textColorText.value = e.target.value;
                draw();
            });
            textColorText.addEventListener('input', (e) => {
                if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                    textColorInput.value = e.target.value;
                    draw();
                }
            });
        }

        // 3. Attach input listeners to ALL text and rotation controls so they update instantly
        const liveInputIds = ['textContent', 'textX', 'textY', 'fontSize', 'rotateZ', 'textAbove'];
        liveInputIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', draw);
                el.addEventListener('change', draw); // 'change' handles checkbox toggles reliably
            }
        });

        // Put the textAbove listener right here with them:
        const textAboveEl = document.getElementById('textAbove');
        if (textAboveEl) {
            textAboveEl.addEventListener('change', draw);
        }

        // Main Draw Function
        // Helper to convert hex to RGB
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }
       // new function
        function syncInputsFromActiveImage() {
            if (uploadedImages.length === 0) return;
            const active = uploadedImages[currentImageIndex];
            
            document.getElementById('posX').value = active.posX;
            document.getElementById('posY').value = active.posY;
            document.getElementById('scaleX').value = active.scaleX;
            document.getElementById('scaleY').value = active.scaleY;
            document.getElementById('rotateX').value = active.rotateX;
            document.getElementById('rotateY').value = active.rotateY;
            document.getElementById('rotateZ').value = active.rotateZ;
            document.getElementById('cornerRadius').value = active.cornerRadius;
            document.getElementById('strokeWidth').value = active.strokeWidth;
        }
        // Main Draw Function with 3D Perspective and Figma Shadow support
        function draw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Background Theme
    if (bgImages && bgImages[currentBgIndex]) {
        ctx.drawImage(bgImages[currentBgIndex], 0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 2. Draw Text (if any)
    const textContent = document.getElementById('textContent')?.value || '';
    if (textContent.trim() !== '') {
        ctx.save();
        ctx.font = `600 ${document.getElementById('fontSize')?.value || 28}px sans-serif`;
        ctx.fillStyle = document.getElementById('textColor')?.value || '#ffffff';
        ctx.fillText(textContent, parseFloat(document.getElementById('textX')?.value) || 60, parseFloat(document.getElementById('textY')?.value) || 60);
        ctx.restore();
    }

    // 3. Draw ALL Uploaded Images (or fallback to default if empty)
    if (uploadedImages.length === 0) {
        // Draw default placeholder image if no uploads exist
        if (defaultImg.complete) {
            ctx.drawImage(defaultImg, 150, 150, defaultImg.width * 0.7, defaultImg.height * 0.7);
        }
    } else {
        uploadedImages.forEach((item, index) => {
            // If user is currently typing/tweaking an input, sync it to the active item in real-time
            if (index === currentImageIndex) {
                item.posX = parseFloat(document.getElementById('posX').value) || item.posX;
                item.posY = parseFloat(document.getElementById('posY').value) || item.posY;
                item.scaleX = parseFloat(document.getElementById('scaleX').value) || item.scaleX;
                item.scaleY = parseFloat(document.getElementById('scaleY').value) || item.scaleY;
                item.rotateX = parseFloat(document.getElementById('rotateX').value) || item.rotateX;
                item.rotateY = parseFloat(document.getElementById('rotateY').value) || item.rotateY;
                item.rotateZ = parseFloat(document.getElementById('rotateZ').value) || item.rotateZ;
                item.cornerRadius = parseFloat(document.getElementById('cornerRadius').value) || item.cornerRadius;
                item.strokeWidth = parseFloat(document.getElementById('strokeWidth').value) || item.strokeWidth;
            }

            const w = item.img.width * (item.scaleX / 100);
            const h = item.img.height * (item.scaleY / 100);

            ctx.save();
            ctx.translate(item.posX, item.posY);
            ctx.transform(1, Math.tan(item.rotateX * Math.PI / 180), Math.tan(item.rotateY * Math.PI / 180), 1, 0, 0);
            ctx.rotate(item.rotateZ * Math.PI / 180);

            // Draw shadow for this specific card
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetX = 10;
            ctx.shadowOffsetY = 20;

            ctx.beginPath();
            ctx.roundRect(0, 0, w, h, item.cornerRadius);
            ctx.closePath();
            ctx.fillStyle = '#000000';
            ctx.fill();

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;

            ctx.save();
            ctx.clip();
            ctx.drawImage(item.img, 0, 0, w, h);
            ctx.restore();

            if (item.strokeWidth > 0) {
                ctx.lineWidth = item.strokeWidth * 2;
                ctx.strokeStyle = item.strokeColor;
                ctx.stroke();
            }
            ctx.restore();
        });
    }
}

        // Horizontal Drag Scrubbing
        document.querySelectorAll('.control-field, .full-field').forEach(field => {
            const input = field.querySelector('input');
            if (!input) return; // Add safeguard
            
            let isDragging = false;
            let startX = 0;
            let startVal = 0;

            field.addEventListener('mousedown', (e) => {
                if (e.target === input) return;
                isDragging = true;
                startX = e.clientX;
                startVal = parseFloat(input.value) || 0;
                document.body.style.cursor = 'ew-resize';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const delta = e.clientX - startX;
                // Sensitivities
                let deltaMultiplier = 0.5;
                if (input.id.startsWith('rotate') || input.id.startsWith('shadow')) deltaMultiplier = 1; 

                let newVal = startVal + Math.round(delta * deltaMultiplier);
                
                // Limits
                if (input.id === 'scaleX' || input.id === 'scaleY') {
                    newVal = Math.max(10, Math.min(300, newVal));
                } else if (input.id === 'cornerRadius') {
                    newVal = Math.max(0, Math.min(200, newVal));
                } else if (input.id === 'strokeWidth') {
                    newVal = Math.max(0, Math.min(50, newVal));
                } else if (input.id.startsWith('rotate')) {
                    newVal = Math.max(-90, Math.min(90, newVal)); // Limit rotation
                } else if (input.id === 'shadowOpacity') {
                    newVal = Math.max(0, Math.min(100, newVal));
                } else if (input.id === 'shadowBlur') {
                    newVal = Math.max(0, newVal);
                }

                input.value = newVal;
                draw();
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    document.body.style.cursor = 'default';
                }
            });
        });

        // Load Google Fonts dynamically
        const fontLink = document.createElement('link');
        fontLink.rel = 'stylesheet';
        fontLink.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap';
        document.head.appendChild(fontLink);

        // File Upload Handler
        // Update your fileInput event listener for multi-upload:
        const fileInput = document.getElementById('fileInput');
if (fileInput) {
    fileInput.addEventListener('change', function(e) {
        const files = e.target.files;
        if (files && files.length > 0) {
            Array.from(files).forEach((file, idx) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedImages.push({
                            img: img,
                            posX: 100 + (uploadedImages.length * 40), // Offset each new image slightly
                            posY: 100 + (uploadedImages.length * 40),
                            scaleX: 70,
                            scaleY: 70,
                            rotateX: 0,
                            rotateY: 0,
                            rotateZ: 0,
                            cornerRadius: 10,
                            strokeWidth: 2,
                            strokeColor: '#5b6ab3',
                            shadowColor: '#000000',
                            shadowOpacity: 25,
                            shadowX: 10,
                            shadowY: 20,
                            shadowBlur: 30,
                            shadowSpread: 5
                        });
                        currentImageIndex = uploadedImages.length - 1;
                        syncInputsFromActiveImage();
                        updateImageThumbnails();
                        draw();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
    });
}

        function updateImageThumbnails() {
            const grid = document.getElementById('imageThumbGrid');
            if (!grid) return;
            grid.innerHTML = '';
            
            uploadedImages.forEach((item, index) => {
                const thumb = document.createElement('div');
                thumb.className = `bg-thumb ${index === currentImageIndex ? 'active' : ''}`;
                thumb.style.backgroundImage = `url('${item.img.src}')`;
                thumb.style.backgroundSize = 'cover';
                thumb.style.backgroundPosition = 'center';
                thumb.style.backgroundColor = '#333'; // Prevents dark/black box if loading
                thumb.style.position = 'relative';

                // Click to select image (saves current inputs first)
                thumb.onclick = (e) => {
                    if (e.target.classList.contains('delete-btn')) return; // Don't select if clicking delete
                    
                    // Save current inputs to active item before switching
                    if (uploadedImages[currentImageIndex]) {
                        uploadedImages[currentImageIndex].posX = parseFloat(document.getElementById('posX').value) || 0;
                        uploadedImages[currentImageIndex].posY = parseFloat(document.getElementById('posY').value) || 0;
                        uploadedImages[currentImageIndex].scaleX = parseFloat(document.getElementById('scaleX').value) || 70;
                        uploadedImages[currentImageIndex].scaleY = parseFloat(document.getElementById('scaleY').value) || 70;
                        uploadedImages[currentImageIndex].rotateX = parseFloat(document.getElementById('rotateX').value) || 0;
                        uploadedImages[currentImageIndex].rotateY = parseFloat(document.getElementById('rotateY').value) || 0;
                        uploadedImages[currentImageIndex].rotateZ = parseFloat(document.getElementById('rotateZ').value) || 0;
                        uploadedImages[currentImageIndex].cornerRadius = parseFloat(document.getElementById('cornerRadius').value) || 10;
                        uploadedImages[currentImageIndex].strokeWidth = parseFloat(document.getElementById('strokeWidth').value) || 2;
                    }

                    currentImageIndex = index;
                    syncInputsFromActiveImage();
                    updateImageThumbnails();
                    draw();
                };

                // Delete Icon (Top Right)
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '&times;';
                deleteBtn.title = 'Delete image';
                deleteBtn.style.cssText = `
                    position: absolute;
                    top: 4px;
                    right: 4px;
                    background: rgba(0, 0, 0, 0.7);
                    color: #fff;
                    border: none;
                    border-radius: 50%;
                    width: 20px;
                    height: 20px;
                    font-size: 12px;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    transition: background 0.2s;
                `;
                deleteBtn.onmouseover = () => deleteBtn.style.background = '#ff3b30';
                deleteBtn.onmouseout = () => deleteBtn.style.background = 'rgba(0, 0, 0, 0.7)';
                
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    uploadedImages.splice(index, 1);
                    if (currentImageIndex >= uploadedImages.length) {
                        currentImageIndex = Math.max(0, uploadedImages.length - 1);
                    }
                    syncInputsFromActiveImage();
                    updateImageThumbnails();
                    draw();
                };

                thumb.appendChild(deleteBtn);
                grid.appendChild(thumb);
            });
        }
        // Sync Color Inputs
        const strokeColorInput = document.getElementById('strokeColor');
        const strokeColorText = document.getElementById('strokeColorText');

        strokeColorInput.addEventListener('input', (e) => {
            strokeColorText.value = e.target.value;
            draw();
        });

        strokeColorText.addEventListener('input', (e) => {
            if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                strokeColorInput.value = e.target.value;
                draw();
            }
        });

        // Input Change Listener for all number fields
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('input', () => draw());
        });

        // Horizontal Drag Scrubbing (Click & Drag left/right to change values)
        document.querySelectorAll('.control-field, .full-field').forEach(field => {
            const input = field.querySelector('input');
            let isDragging = false;
            let startX = 0;
            let startVal = 0;

            field.addEventListener('mousedown', (e) => {
                if (e.target === input) return; // allow normal input typing click
                isDragging = true;
                startX = e.clientX;
                startVal = parseFloat(input.value) || 0;
                document.body.style.cursor = 'ew-resize';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const delta = e.clientX - startX;
                let newVal = startVal + Math.round(delta * 0.5);
                
                // Constraints
                if (input.id === 'scaleX' || input.id === 'scaleY') {
                    newVal = Math.max(10, Math.min(300, newVal));
                } else if (input.id === 'cornerRadius') {
                    newVal = Math.max(0, Math.min(200, newVal));
                } else if (input.id === 'strokeWidth') {
                    newVal = Math.max(0, Math.min(50, newVal));
                }

                input.value = newVal;
                draw();
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    document.body.style.cursor = 'default';
                }
            });
        });

        // Export PNG
        // High-Resolution 1080p Export PNG
        // High-Resolution Proportional Export (2000x1200)
        // Clean Offscreen 2000x1200 Export (Does not touch preview canvas)
        // Perfect Proportional 2000x1200 Export using Context Scaling
        // Fully Proportional 2000x1200 Export
        // Perfect Proportional 2000x1200 Export with High-Quality Smoothing
        document.getElementById('exportBtn').addEventListener('click', () => {
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = 2000;
            exportCanvas.height = 1200;
            const eCtx = exportCanvas.getContext('2d');

            eCtx.imageSmoothingEnabled = true;
            eCtx.imageSmoothingQuality = 'high';

            const scale = 2; // 2x scale factor for HD output

            // Draw Background
            if (bgImages[currentBgIndex]) {
                eCtx.drawImage(bgImages[currentBgIndex], 0, 0, exportCanvas.width, exportCanvas.height);
            } else {
                eCtx.fillStyle = '#222';
                eCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            }

            const imgToDraw = (uploadedImages.length > 0) ? uploadedImages[currentImageIndex] : defaultImg;
            if (!imgToDraw) return;

            const posX = (parseFloat(document.getElementById('posX').value) || 0) * scale;
            const posY = (parseFloat(document.getElementById('posY').value) || 0) * scale;
            const scaleX = (parseFloat(document.getElementById('scaleX').value) || 70) / 100;
            const scaleY = (parseFloat(document.getElementById('scaleY').value) || 70) / 100;
            const rotX = (parseFloat(document.getElementById('rotateX').value) || 0) * (Math.PI / 180);
            const rotY = (parseFloat(document.getElementById('rotateY').value) || 0) * (Math.PI / 180);
            const rotZ = (parseFloat(document.getElementById('rotateZ').value) || 0) * (Math.PI / 180);
            const radius = (parseFloat(document.getElementById('cornerRadius').value) || 0) * scale;
            const strokeWidth = (parseFloat(document.getElementById('strokeWidth').value) || 0) * scale;
            const strokeColor = document.getElementById('strokeColor').value;
            const shadowColorHex = document.getElementById('shadowColor').value;
            const shadowOpacity = parseFloat(document.getElementById('shadowOpacity').value) || 25;
            const shadowX = (parseFloat(document.getElementById('shadowX').value) || 0) * scale;
            const shadowY = (parseFloat(document.getElementById('shadowY').value) || 0) * scale;
            const shadowBlur = (parseFloat(document.getElementById('shadowBlur').value) || 0) * scale;
            const shadowSpread = (parseFloat(document.getElementById('shadowSpread').value) || 0) * scale;

            const textContent = document.getElementById('textContent').value || '';
            const textColor = document.getElementById('textColor').value || '#ffffff';
            const textX = (parseFloat(document.getElementById('textX').value) || 50) * scale;
            const textY = (parseFloat(document.getElementById('textY').value) || 50) * scale;
            const fontSize = (parseFloat(document.getElementById('fontSize').value) || 22) * scale;
            const fontFamily = document.getElementById('fontFamily') ? document.getElementById('fontFamily').value : 'Inter';
            const fontWeight = document.getElementById('fontWeight') ? document.getElementById('fontWeight').value : '600';

            const rgb = hexToRgb(shadowColorHex);
            const canvasShadowColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${shadowOpacity / 100})`;

            const w = imgToDraw.width * scaleX * scale;
            const h = imgToDraw.height * scaleY * scale;

            // Draw card on export canvas
            eCtx.save();
            eCtx.translate(posX, posY);
            eCtx.transform(1, Math.tan(rotX), Math.tan(rotY), 1, 0, 0);
            eCtx.rotate(rotZ);

            if (canvasShadowColor !== 'rgba(0, 0, 0, 0)' && shadowBlur > 0) {
                eCtx.shadowColor = canvasShadowColor;
                eCtx.shadowBlur = shadowBlur;
                eCtx.shadowOffsetX = shadowX;
                eCtx.shadowOffsetY = shadowY;
            }

            eCtx.beginPath();
            eCtx.roundRect(0, 0, w, h, radius);
            eCtx.closePath();
            eCtx.fillStyle = '#000000';
            eCtx.fill();

            eCtx.shadowColor = 'transparent';
            eCtx.shadowBlur = 0;
            eCtx.shadowOffsetX = 0;
            eCtx.shadowOffsetY = 0;

            eCtx.save();
            eCtx.clip();
            eCtx.drawImage(imgToDraw, 0, 0, w, h);
            eCtx.restore();

            if (strokeWidth > 0) {
                eCtx.lineWidth = strokeWidth * 2;
                eCtx.strokeStyle = strokeColor;
                eCtx.stroke();
            }
            eCtx.restore();

            // Draw Text on export canvas (scaled positions/size, zero shadow)
            if (textContent.trim() !== '') {
                eCtx.save();
                eCtx.font = `${fontWeight} ${fontSize}px '${fontFamily}', sans-serif`;
                eCtx.fillStyle = textColor;
                eCtx.shadowColor = 'transparent';
                eCtx.shadowBlur = 0;
                eCtx.fillText(textContent, textX, textY);
                eCtx.restore();
            }

            // Trigger download
            const link = document.createElement('a');
            link.download = 'fancy-post-hd.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        });
        // Initialize App
        createBgThumbnails();
    </script>
</body>
