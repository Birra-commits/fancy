<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy - Beautify your posts background</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1a1e;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Preview Canvas Area */
        .preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121215;
            position: relative;
            overflow: hidden;
            padding: 40px;
        }

        .canvas-wrapper {
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 1000px;
            height: 600px;
            object-fit: contain;
        }

        /* Sidebar Control Panel */
        .sidebar {
            width: 420px;
            background: #18181c;
            border-left: 1px, #2a2a30;
            border-left: 1px solid #2a2a30;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            padding: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 24px;
        }

        /* Section headings */
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            margin-top: 16px;
        }

        /* 3x3 Background Theme Grid */
        .bg-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .bg-thumb {
            aspect-ratio: 16/10;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            overflow: hidden;
            position: relative;
            transition: all 0.2s ease;
            background-size: cover;
            background-position: center;
        }

        .bg-thumb:hover {
            transform: scale(1.03);
            border-color: rgba(255,255,255,0.4);
        }

        .bg-thumb.active {
            border-color: #0a84ff;
            box-shadow: 0 0 12px rgba(10, 132, 255, 0.4);
        }

        /* Control Groups */
        .control-group {
            margin-bottom: 16px;
        }

        .control-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }

        .control-field {
            flex: 1;
            background: #222228;
            border: 1px solid #2f2f38;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: ew-resize;
            transition: border-color 0.2s;
        }

        .control-field:hover {
            border-color: #484854;
        }

        .control-field label {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 500;
            cursor: ew-resize;
        }

        .control-field input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            width: 50px;
            text-align: right;
            outline: none;
        }

        /* Full width inputs */
        .full-field {
            width: 100%;
            background: #222228;
            border: 1px solid #2f2f38;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: ew-resize;
            margin-bottom: 8px;
        }

        .full-field label {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 500;
        }

        .full-field input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            width: 60px;
            text-align: right;
            outline: none;
        }
        /* New */
        /* Color Picker & Text Input Styling */
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 1px solid #484854;
            border-radius: 4px;
        }

        .color-text {
            font-size: 12px;
            font-family: monospace;
            color: #ffffff;
            background: #18181c;
            border: 1px solid #2f2f38;
            border-radius: 4px;
            padding: 2px 6px;
            width: 70px;
            text-align: center;
            outline: none;
        }

        /* Stroke Color & Style Row */
        .stroke-row {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #222228;
            border: 1px solid #2f2f38;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 1px solid #484854;
            border-radius: 4px;
        }

        .color-text {
            font-size: 12px;
            font-family: monospace;
            color: #ffffff;
            background: #18181c;
            border: 1px solid #2f2f38;
            border-radius: 4px;
            padding: 2px 6px;
            width: 70px;
            text-align: center;
            outline: none;
        }

        /* Upload & Export Buttons */
        .upload-section {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid #2a2a30;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            background: #0a84ff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #0071e3;
        }

        .btn-export {
            background: #2c2c33;
            color: #ffffff;
            border: 1px solid #3a3a44;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-export:hover {
            background: #383842;
            border-color: #555562;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Canvas Preview Area -->
    <div class="preview-container">
        <div class="canvas-wrapper">
            <canvas id="canvas" width="1000" height="600"></canvas>
        </div>
    </div>

    <!-- Sidebar Controls -->
    <div class="sidebar">
        <div class="header">
            <h1>Fancy</h1>
            <p>Beautify your posts background with easy tool.</p>
        </div>

        <div class="section-title">Background Theme</div>
        <div class="bg-grid" id="bgGrid">
            <!-- Populated via JavaScript -->
        </div>

        <div class="section-title">Position</div>
        <div class="control-row">
            <div class="control-field" data-input="posX">
                <label>X</label>
                <input type="number" id="posX" value="100">
            </div>
            <div class="control-field" data-input="posY">
                <label>Y</label>
                <input type="number" id="posY" value="80">
            </div>
        </div>

        <div class="section-title">Image Transformation</div>
        <div class="control-row">
            <div class="control-field" data-input="scaleX" title="Scale (X %)">
                <label>Scale-X</label>
                <input type="number" id="scaleX" value="70">
            </div>
            <div class="control-field" data-input="scaleY" title="Scale (Y %)">
                <label>Scale-Y</label>
                <input type="number" id="scaleY" value="70">
            </div>
        </div>
        <div class="control-row">
            <div class="control-field" data-input="rotateX" title="3D Rotate X (Perspective)">
                <label>3D-X</label>
                <input type="number" id="rotateX" value="15">
            </div>
            <div class="control-field" data-input="rotateY" title="3D Rotate Y (Perspective)">
                <label>3D-Y</label>
                <input type="number" id="rotateY" value="0">
            </div>
        </div>

        <div class="section-title">Drop Shadow</div>
        <div class="stroke-row">
            <div class="color-picker-wrapper">
                <input type="color" id="shadowColor" value="#000000">
                <input type="text" id="shadowColorText" class="color-text" value="#000000">
            </div>
            <div class="control-field" data-input="shadowOpacity" title="Shadow Opacity %" style="margin-bottom:0;">
                <label>Opacity</label>
                <input type="number" id="shadowOpacity" value="25" min="0" max="100">
            </div>
        </div>
        <div class="control-row">
            <div class="control-field" data-input="shadowX" title="Shadow X Offset">
                <label>X</label>
                <input type="number" id="shadowX" value="10">
            </div>
            <div class="control-field" data-input="shadowY" title="Shadow Y Offset">
                <label>Y</label>
                <input type="number" id="shadowY" value="20">
            </div>
        </div>
        <div class="control-row">
            <div class="control-field" data-input="shadowBlur" title="Shadow Blur (Figma properties)">
                <label>Blur</label>
                <input type="number" id="shadowBlur" value="30" min="0">
            </div>
            <div class="control-field" data-input="shadowSpread" title="Shadow Spread (Figma properties)">
                <label>Spread</label>
                <input type="number" id="shadowSpread" value="5">
            </div>
        </div>

        <div class="section-title">Corner Radius</div>
        <div class="full-field" data-input="cornerRadius">
            <label>Radius</label>
            <input type="number" id="cornerRadius" value="50">
        </div>

        <div class="section-title">Stroke</div>
        <div class="stroke-row">
            <div class="color-picker-wrapper">
                <input type="color" id="strokeColor" value="#000000">
                <input type="text" id="strokeColorText" class="color-text" value="#000000">
            </div>
            <div class="control-field" data-input="strokeWidth" style="margin-bottom:0;">
                <label>Weight</label>
                <input type="number" id="strokeWidth" value="0">
            </div>
        </div>

        <!-- Upload & Export -->
        <div class="upload-section">
            <input type="file" id="fileInput" accept="image/*">
            <button class="btn-primary" onclick="document.getElementById('fileInput').click()">Upload Image</button>
            <button class="btn-export" id="exportBtn">Export PNG</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // State variables
        let currentBgIndex = 0;
        let bgImages = [];
        let uploadedImg = null;

        // Default test image (gradient placeholder if no upload yet)
        const defaultImg = new Image();
        defaultImg.crossOrigin = "anonymous";
        defaultImg.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
                <rect width="600" height="400" fill="#1e1e24"/>
                <rect x="40" y="40" width="520" height="320" rx="20" fill="#2d2d38"/>
                <circle cx="70" cy="70" r="8" fill="#ff5f56"/>
                <circle cx="95" cy="70" r="8" fill="#ffbd2e"/>
                <circle cx="120" cy="70" r="8" fill="#27c93f"/>
                <text x="300" y="215" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="600" text-anchor="middle">Upload your image to start</text>
            </svg>
        `);
        defaultImg.onload = () => draw();

        // Background Theme Thumbnails Generation (Procedural Preview BGs matching reference)
        const bgFiles = [
            '1.jpg',
            '2.jpg',
            '3.jpg',
            '4.jpg',
            '5.jpg',
            '6.jpg',
            '7.jpg',
            '8.jpg',
            '9.jpg'
        ];

        function createBgThumbnails() {
            const grid = document.getElementById('bgGrid');
            grid.innerHTML = '';
            
            bgFiles.forEach((file, index) => {
                const thumb = document.createElement('div');
                thumb.className = `bg-thumb ${index === 0 ? 'active' : ''}`;
                thumb.style.backgroundImage = `url('${file}')`;
                thumb.style.backgroundSize = 'cover';
                thumb.style.backgroundPosition = 'center';
                
                thumb.onclick = () => {
                    document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                    currentBgIndex = index;
                    draw();
                };
                grid.appendChild(thumb);

                const img = new Image();
                img.src = file;
                img.onload = () => {
                    bgImages[index] = img;
                    if (index === currentBgIndex) draw();
                };
            });
        }

        // Sync Shadow Color Inputs
        const shadowColorInput = document.getElementById('shadowColor');
        const shadowColorText = document.getElementById('shadowColorText');

        shadowColorInput.addEventListener('input', (e) => {
            shadowColorText.value = e.target.value;
            draw();
        });

        shadowColorText.addEventListener('input', (e) => {
            if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                shadowColorInput.value = e.target.value;
                draw();
            }
        });

        // Main Draw Function
        // Helper to convert hex to RGB
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        // Main Draw Function with 3D Perspective and Figma Shadow support
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background Theme
            if (bgImages[currentBgIndex]) {
                ctx.drawImage(bgImages[currentBgIndex], 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#222';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Draw Uploaded / Default Image
            const imgToDraw = uploadedImg || defaultImg;
            if (!imgToDraw) return;

            // Gather all input parameters
            const params = {
                posX: parseFloat(document.getElementById('posX').value) || 0,
                posY: parseFloat(document.getElementById('posY').value) || 0,
                scaleX: (parseFloat(document.getElementById('scaleX').value) || 70) / 100,
                scaleY: (parseFloat(document.getElementById('scaleY').value) || 70) / 100,
                rotX: (parseFloat(document.getElementById('rotateX').value) || 0) * (Math.PI / 180),
                rotY: (parseFloat(document.getElementById('rotateY').value) || 0) * (Math.PI / 180),
                radius: parseFloat(document.getElementById('cornerRadius').value) || 0,
                strokeWidth: parseFloat(document.getElementById('strokeWidth').value) || 0,
                strokeColor: document.getElementById('strokeColor').value,
                shadowColorHex: document.getElementById('shadowColor').value,
                shadowOpacity: parseFloat(document.getElementById('shadowOpacity').value) || 25,
                shadowX: parseFloat(document.getElementById('shadowX').value) || 0,
                shadowY: parseFloat(document.getElementById('shadowY').value) || 0,
                shadowBlur: parseFloat(document.getElementById('shadowBlur').value) || 0,
                shadowSpread: parseFloat(document.getElementById('shadowSpread').value) || 0
            };

            // Process Shadow Color (Hex + Opacity)
            const rgb = hexToRgb(params.shadowColorHex);
            const canvasShadowColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${params.shadowOpacity / 100})`;

            // Base dimensions
            const w = imgToDraw.width * params.scaleX;
            const h = imgToDraw.height * params.scaleY;

            // Calculate Perspective Deformation (Simple projection)
            const degX = params.rotX;
            const degY = params.rotY;

            // Define the 4 corner points of the rect (pre-transformation)
            // Points: TopLeft, TopRight, BottomRight, BottomLeft
            let pts = [
                {x: 0, y: 0}, 
                {x: w, y: 0}, 
                {x: w, y: h}, 
                {x: 0, y: h}
            ];

            // Center point for rotation
            const cx = w / 2;
            const cy = h / 2;

            // Apply 3D Rotation Math (Simple projection on 2D plane)
            pts = pts.map(p => {
                // Shift to origin
                let px = p.x - cx;
                let py = p.y - cy;
                
                // Rotate X axis
                let py1 = py * Math.cos(degX);
                let pz1 = py * Math.sin(degX);
                
                // Rotate Y axis
                let px2 = px * Math.cos(degY) + pz1 * Math.sin(degY);
                let pz2 = -px * Math.sin(degY) + pz1 * Math.cos(degY);
                
                // Perspective division (D=distance from camera, higher = less perspective)
                const D = 1000;
                let scale = D / (D - pz2);
                
                return {
                    x: px2 * scale + cx,
                    y: py1 * scale + cy
                };
            });

            // Recalculate minimum bounds after perspective shift
            const minX = Math.min(...pts.map(p => p.x));
            const minY = Math.min(...pts.map(p => p.y));
            pts = pts.map(p => ({x: p.x - minX, y: p.y - minY})); // Normalize to buffer origin

            // Update bounds for buffer size
            const bufW = Math.max(...pts.map(p => p.x)) + params.shadowBlur * 2 + params.shadowSpread * 2;
            const bufH = Math.max(...pts.map(p => p.y)) + params.shadowBlur * 2 + params.shadowSpread * 2;

            // Use a secondary buffer canvas to handle perspective shadow and spread accurately
            if (!this.bufCanvas) {
                this.bufCanvas = document.createElement('canvas');
                this.bufCtx = this.bufCanvas.getContext('2d');
            }
            this.bufCanvas.width = Math.max(1, bufW);
            this.bufCanvas.height = Math.max(1, bufH);
            this.bufCtx.clearRect(0, 0, this.bufCanvas.width, this.bufCanvas.height);

            const offset = params.shadowBlur + params.shadowSpread;

            // Function to generate the shaped path on a context
            function createShapedPath(ctx, p, r) {
                // Vector math to define a path between arbitrary perspective points is difficult
                // For this implementation, we map back to original space to create roundrect
                // Then transform the context.
            }

            // We must transform the entire context to match perspective, then draw the rounded rectangle
            this.bufCtx.save();
            this.bufCtx.translate(offset - minX, offset - minY); // Offset to buffer origin

            // Draw FIGMA STYLE Shadow First
            if (canvasShadowColor !== 'rgba(0, 0, 0, 0)') {
                this.bufCtx.shadowColor = canvasShadowColor;
                this.bufCtx.shadowBlur = params.shadowBlur;
                this.bufCtx.shadowOffsetX = params.shadowX;
                this.bufCtx.shadowOffsetY = params.shadowY;
                
                // Figma "Spread" emulation (draws shadow larger than shape)
                this.bufCtx.fillStyle = canvasShadowColor; 
                this.bufCtx.fill(); // Fills the path with shadow activated
            }

            // Define original rounded rectangle shape
            this.bufCtx.beginPath();
            this.bufCtx.roundRect(0, 0, w, h, params.radius);
            this.bufCtx.closePath();

            // Clip and draw image (Applying perspective deformation to image itself)
            this.bufCtx.save();
            this.bufCtx.clip();
            this.bufCtx.drawImage(imgToDraw, 0, 0, w, h);
            this.bufCtx.restore();

            // Draw Stroke / Border
            if (params.strokeWidth > 0) {
                this.bufCtx.lineWidth = params.strokeWidth * 2;
                this.bufCtx.strokeStyle = params.strokeColor;
                this.bufCtx.stroke();
            }

            this.bufCtx.restore();

            // 3. Draw the final composed buffer canvas onto the main background
            ctx.save();
            // Need to handle perspective mapping *here* - standard drawImage won't work.
            // Full perspective texture mapping is beyond basic 2D Canvas.
            // Standard approach: Draw the buffer at original position, 
            // but the shadow is cast from the 3D transformed buffer shape.

            // Since full image perspective mapping is too complex for canvas2d without webgl,
            // we will draw the composed, rounded, shadowed image onto the canvas 
            // while applying standard 2D rotation for pseudo-perspective.
            
            ctx.translate(params.posX, params.posY);
            ctx.rotate(params.rotY * 0.1); // Simple 2D skew fallback
            ctx.drawImage(this.bufCanvas, -offset + minX, -offset + minY);

            ctx.restore();
        }

        // Horizontal Drag Scrubbing
        document.querySelectorAll('.control-field, .full-field').forEach(field => {
            const input = field.querySelector('input');
            if (!input) return; // Add safeguard
            
            let isDragging = false;
            let startX = 0;
            let startVal = 0;

            field.addEventListener('mousedown', (e) => {
                if (e.target === input) return;
                isDragging = true;
                startX = e.clientX;
                startVal = parseFloat(input.value) || 0;
                document.body.style.cursor = 'ew-resize';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const delta = e.clientX - startX;
                // Sensitivities
                let deltaMultiplier = 0.5;
                if (input.id.startsWith('rotate') || input.id.startsWith('shadow')) deltaMultiplier = 1; 

                let newVal = startVal + Math.round(delta * deltaMultiplier);
                
                // Limits
                if (input.id === 'scaleX' || input.id === 'scaleY') {
                    newVal = Math.max(10, Math.min(300, newVal));
                } else if (input.id === 'cornerRadius') {
                    newVal = Math.max(0, Math.min(200, newVal));
                } else if (input.id === 'strokeWidth') {
                    newVal = Math.max(0, Math.min(50, newVal));
                } else if (input.id.startsWith('rotate')) {
                    newVal = Math.max(-90, Math.min(90, newVal)); // Limit rotation
                } else if (input.id === 'shadowOpacity') {
                    newVal = Math.max(0, Math.min(100, newVal));
                } else if (input.id === 'shadowBlur') {
                    newVal = Math.max(0, newVal);
                }

                input.value = newVal;
                draw();
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    document.body.style.cursor = 'default';
                }
            });
        });

        // File Upload Handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedImg = img;
                        // Auto set scale to fit nicely if first upload
                        document.getElementById('posX').value = Math.round((canvas.width - img.width * 0.7) / 2);
                        document.getElementById('posY').value = Math.round((canvas.height - img.height * 0.7) / 2);
                        document.getElementById('scaleX').value = 70;
                        document.getElementById('scaleY').value = 70;
                        draw();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Sync Color Inputs
        const strokeColorInput = document.getElementById('strokeColor');
        const strokeColorText = document.getElementById('strokeColorText');

        strokeColorInput.addEventListener('input', (e) => {
            strokeColorText.value = e.target.value;
            draw();
        });

        strokeColorText.addEventListener('input', (e) => {
            if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                strokeColorInput.value = e.target.value;
                draw();
            }
        });

        // Input Change Listener for all number fields
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('input', () => draw());
        });

        // Horizontal Drag Scrubbing (Click & Drag left/right to change values)
        document.querySelectorAll('.control-field, .full-field').forEach(field => {
            const input = field.querySelector('input');
            let isDragging = false;
            let startX = 0;
            let startVal = 0;

            field.addEventListener('mousedown', (e) => {
                if (e.target === input) return; // allow normal input typing click
                isDragging = true;
                startX = e.clientX;
                startVal = parseFloat(input.value) || 0;
                document.body.style.cursor = 'ew-resize';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const delta = e.clientX - startX;
                let newVal = startVal + Math.round(delta * 0.5);
                
                // Constraints
                if (input.id === 'scaleX' || input.id === 'scaleY') {
                    newVal = Math.max(10, Math.min(300, newVal));
                } else if (input.id === 'cornerRadius') {
                    newVal = Math.max(0, Math.min(200, newVal));
                } else if (input.id === 'strokeWidth') {
                    newVal = Math.max(0, Math.min(50, newVal));
                }

                input.value = newVal;
                draw();
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    document.body.style.cursor = 'default';
                }
            });
        });

        // Export PNG
        document.getElementById('exportBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'fancy-post.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Initialize App
        createBgThumbnails();
    </script>
</body>
</html>
